{% extends "base.html" %}

{% block title %}
TradeDesk | Edit Trade
{% endblock %}

{% block content %}

<form class="auth-form" action="{{ url_for('trade.edit_trade', trade_id=trade.id) }}" method="POST">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">

        <div class="form-group">
            <label for="trade_date">Date *</label>

            <input
                type="date"
                id="trade_date"
                name="trade_date"
                value="{{ trade.trade_date.strftime('%Y-%m-%d') }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="trade_time">Time</label>

            <input
                type="time"
                id="trade_time"
                name="trade_time"
                value="{{ trade.trade_time.strftime('%H:%M') if trade.trade_time else '' }}"
            >
        </div>

    </div>

    <div class="form-group">

        <label for="amount">Amount ($) *</label>

        <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            value="{{ trade.amount }}"
            placeholder="e.g. 150.00 or -150.00"
            required
        >

    </div>

    <div id="trade-status" class="status-neutral">
        {% if trade.amount > 0 %}
            Profit
        {% elif trade.amount < 0 %}
            Loss
        {% else %}
            Enter an amount
        {% endif %}
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">

        <div class="form-group">

            <label>Followed Plan? *</label>

            <div class="toggle-group">

                <label class="toggle-option">

                    <input
                        type="radio"
                        name="discipline"
                        value="yes"
                        {% if trade.followed_plan %}checked{% endif %}
                        required
                    >

                    <span>Yes</span>

                </label>

                <label class="toggle-option">

                    <input
                        type="radio"
                        name="discipline"
                        value="no"
                        {% if not trade.followed_plan %}checked{% endif %}
                    >

                    <span>No</span>

                </label>

            </div>

        </div>

    </div>

    <div class="form-group">

        <label for="notes">Trade Notes / Reflections</label>

        <textarea
            id="notes"
            name="notes"
            class="notes-box"
            rows="4"
            placeholder="Enter setup details, rules followed, feelings, etc."
        >{{ trade.notes or '' }}</textarea>

    </div>

    <button
        type="submit"
        class="btn-primary"
        style="background-color: #2563eb;"
    >
        Update Trade
    </button>

</form>

<div class="auth-footer">

    <a href="{{ url_for('dashboard') }}">
        Cancel and Back to Dashboard
    </a>

</div>

{% endblock %}
