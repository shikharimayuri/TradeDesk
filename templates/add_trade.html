{% extends "base.html" %}
{% block title %}
TradeDesk | Log Trade
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 550px;">
        <h2>Log a New Trade</h2>
        <p class="auth-subtitle">Record your session to maintain your consistency streak</p>
        
        <form class="auth-form" action="{{ url_for('trade.add_trade') }}" method="POST">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label for="trade_date">Date *</label>
                    <input type="date" id="trade_date" name="trade_date" value="{{ today_str }}" required>
                </div>
                <div class="form-group">
                    <label for="trade_time">Time</label>
                    <input type="time" id="trade_time" name="trade_time" value="{{ now_str }}">
                </div>
            </div>
            
            <div class="form-group">
                <label for="amount">Amount ($) *</label>
                <input type="number" id="amount" name="amount" step="0.01" placeholder="e.g. 150.00 or -150.00" required>
            </div>
            <div id="trade-status" class="status-neutral">
                Enter an amount
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
                <div class="form-group">
                    <label>Followed Plan? *</label>
                    <div class="toggle-group">
                        <label class="toggle-option">
                            <input type="radio" name="discipline" value="yes" checked required>
                            <span>Yes</span>
                        </label>
                        <label class="toggle-option">
                            <input type="radio" name="discipline" value="no">
                            <span>No</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="notes">Trade Notes / Reflections</label>
                <textarea id="notes" name="notes" class="notes-box" rows="4" placeholder="Enter setup details, rules followed, feelings, etc."></textarea>
            </div>
            
            <button type="submit" class="btn-primary" style="background-color: #22c55e;">Log Trade</button>
        </form>
        
        <div class="auth-footer">
            <a href="{{ url_for('dashboard') }}">Cancel and Back to Dashboard</a>
        </div>
    </div>
</div>

<script>
    const amountInput = document.getElementById("amount");
    const statusBox = document.getElementById("trade-status");

    amountInput.addEventListener("input", function (){
        const amount = parseFloat(this.value);

        statusBox.className = "";
        this.classList.remove(
            "amount-profit",
            "amount-loss",
            "amount-neutral"
        );

        if(this.value === "") {
            statusBox.classList.add("status-neutral");
            statusBox.innerHTML = "Enter an amount";
            this.classList.add("amount-neutral");
        }

        else if (amount > 0) {
            statusBox.classList.add("status-profit");
            statusBox.innerHTML = "PROFIT";
            this.classList.add("amount-profit");
        }
        
        else if(amount < 0) {
            statusBox.classList.add("status-loss");
            statusBox.innerHTML = "LOSS";
            this.classList.add("amount-loss");
        }

        else{
            statusBox.classList.add("status-neutral");
            statusBox.innerHTML = "amount cannot be 0";
            this.classList.add("amount-neutral");
        }
    });
</script>
{% endblock %}
